<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game-container">
      <header>
        <h1>NUMBER GUESSING GAME</h1>
        <p>Can you guess the secret number?</p>
      </header>

      <section class="game-settings">
        <label for="difficulty">Select Difficulty</label>

        <select id="difficulty">
          <option value="easy">Easy (1-50)</option>
          <option value="medium" selected>Medium (1-100)</option>
          <option value="hard">Hard (1-200)</option>
        </select>

        <button id="start-button">START GAME</button>
      </section>

      <section class="game-area">
        <div class="number-range">
          Guess a number between
          <strong id="range">1 and 100</strong>
        </div>

        <div class="attempts">
          Attempts remaining:
          <span id="attempts">7</span>
        </div>

        <div class="input-area">
          <input
            type="number"
            id="guess-input"
            placeholder="Enter your guess"
            disabled
          />

          <button id="guess-button" disabled>GUESS</button>
        </div>

        <p id="message">Press START GAME to begin.</p>

        <div class="game-actions">
          <button id="restart-button">RESTART</button>
        </div>
      </section>

      <section class="statistics">
        <h2>STATISTICS</h2>

        <div class="stats-grid">
          <div class="stat-box">
            <h3 id="games-played">0</h3>
            <p>Played</p>
          </div>

          <div class="stat-box">
            <h3 id="games-won">0</h3>
            <p>Won</p>
          </div>

          <div class="stat-box">
            <h3 id="total-score">0</h3>
            <p>Score</p>
          </div>
        </div>
      </section>

      <footer>
        <p>Mike._24</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
